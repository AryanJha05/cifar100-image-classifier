services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: cifar100_backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app/backend
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    environment:
      - PORT=8000
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
